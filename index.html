<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>E&Y</title>
<style>
:root{--bg:#fbf6ef;--card:#fffdf9;--ink:#4a3628;--muted:#a08c7a;--accent:#d98f8a;--line:#efe2d3;--hero2:#f6efe2;--bear:#b07a52;--bunny:#eab3aa;--bunny-bg:#fff6f4;--note:#fff4d6}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}
*{box-sizing:border-box}
.app{min-height:100dvh;padding:var(--ai-phone-app-safe-top,88px) 16px var(--ai-phone-app-safe-bottom,24px)}
h1{font-size:22px;margin:0 0 14px;letter-spacing:2px}
.tabs{display:flex;gap:8px;margin:0 0 6px}
.tabs button{background:var(--line);color:var(--ink);min-height:34px;padding:0 14px;border-radius:17px;font-size:13px}
.tabs button.on{background:var(--accent);color:#fff}
.hero{position:relative;border-radius:16px;padding:0 0 16px;text-align:center;background:#fff;border:2px solid #f1a9a6;margin:40px 4px 22px;box-shadow:0 4px 0 #f7d3cf,0 6px 14px rgba(200,110,100,.12)}
.hero .stk{position:absolute;right:4px;top:-40px;width:70px;height:auto}
.hero .paw{display:none}
.hero .clip{left:-10px;top:-18px;width:40px;transform:rotate(-20deg)}
.hero .pw{left:-8px;bottom:-30px;width:68px}
.hero .s{font-size:13px;color:var(--muted)}
.hero .s:first-of-type{background:#f9c9c4;color:#7a4038;font-size:16px;font-weight:600;padding:12px 10px;border-radius:13px 13px 0 0;margin-bottom:14px;letter-spacing:2px}
.hero .s:last-of-type{border-top:2px dashed #f4c3be;margin:14px 16px 0;padding-top:10px}
.hero .big{font-size:44px;font-weight:700;letter-spacing:1px;margin:8px 0}
.hero .ph{width:calc(100% - 32px);margin:14px 16px 0;border-radius:10px;display:block}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(80,50,20,.06)}
.dot{flex:0 0 8px;height:40px;border-radius:6px}
.row .t{flex:1;min-width:0}
.row .n{font-size:15px;font-weight:600}
.row .d{font-size:12px;color:var(--muted);margin-top:3px}
.row .c{font-size:13px;color:var(--accent);white-space:nowrap}
.box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.box h3{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:500}
.box p{margin:0;white-space:pre-wrap;line-height:1.8;font-size:14px}
.bear{border-left:3px solid var(--bear)}
.bunny{border-left:3px solid var(--bunny);background:var(--bunny-bg)}
button{font:inherit;min-height:40px;border:0;border-radius:10px;padding:0 14px;background:var(--accent);color:#fff}
button.ghost{background:none;color:var(--accent);padding:0}
button.plain{background:var(--line);color:var(--ink)}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;color:var(--ink);margin-bottom:8px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:6px 0 4px}
.empty{color:var(--muted);font-size:13px}
.bar{display:flex;justify-content:flex-start;gap:16px;align-items:center;margin-bottom:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.cal-h b{font-size:17px;letter-spacing:1px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cell{position:relative;min-height:64px;border-radius:10px;padding:4px 2px 12px;text-align:center}
.cell.has{background:var(--card)}
.num{display:inline-block;width:22px;height:22px;line-height:22px;font-size:12px}
.cell.today .num{background:var(--accent);color:#fff;border-radius:50%}
.moods{display:flex;justify-content:center;gap:1px;margin-top:2px}
.moods img{width:20px;height:20px;object-fit:contain}
.pd{position:absolute;left:50%;bottom:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#e2574c}
.an{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%}
.nt{position:absolute;left:3px;top:2px;font-size:9px;color:var(--muted)}
.slipn{position:relative;background:#fff;border:1.5px solid #f4b8b2;padding:12px;margin:14px 2px;border-radius:8px;box-shadow:0 2px 6px rgba(200,110,100,.12);line-height:1.7;font-size:14px;white-space:pre-wrap}
.slipn::before{content:'';position:absolute;left:50%;top:-7px;width:44px;height:14px;margin-left:-22px;background:rgba(242,190,180,.6);transform:rotate(-3deg)}
.slipn .who{font-size:11px;color:var(--muted);margin-bottom:2px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.pick span{width:46px;height:46px;border-radius:12px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;background:#fff;font-size:11px;color:var(--muted)}
.pick span.on{border-color:var(--accent)}
.pick img{width:38px;height:38px;object-fit:contain}
.mrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.mrow img{width:34px;height:34px;object-fit:contain;flex:0 0 34px}
.mrow input{margin:0;min-width:0}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:6px 0}
.tog input{width:auto;margin:0}
.box,.row{position:relative}
.dk{position:absolute;pointer-events:none;height:auto}
.hero .bow{left:50%;top:-20px;width:46px;margin-left:-23px}
.hero .ap{right:14px;bottom:-18px;width:38px}
.box .f-oc{left:-10px;top:-24px;width:52px;transform:rotate(-12deg)}
.box .f-je{left:92px;bottom:10px;width:40px}
.box .f-se{right:8px;bottom:-14px;width:56px}
.box .f-gh{right:-6px;bottom:96px;width:42px;transform:rotate(10deg)}
.row .ap{position:absolute;right:-4px;top:-12px;width:28px;height:auto;pointer-events:none}
.box .bubble{right:-6px;top:-16px;width:36px}
.inl{width:28px;height:auto;vertical-align:middle;margin-right:6px}
.ghost-e{display:block;width:64px;height:auto;margin:10px auto}
.btns{align-items:center}
.side{width:32px;height:auto}
.memo{width:30px;height:auto;vertical-align:middle;margin-left:6px}
.clv{position:absolute;left:1px;bottom:1px;width:15px;height:auto;pointer-events:none}
.sea{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin-top:18px}
.sea img{width:42px;height:auto}
</style>
</head>
<body>
<div class='app' id='app'></div>
<script>
const A = window.AiPhone;
const DAY = 86400000, T = 'days', C = 'cal', S = 'settings';
const DEF_STICKER = 'https://i.postimg.cc/HLGkQFbt/retouch-2026111213313501.png';
const DEF_MOODS = [
  { name: '平静', url: 'https://i.postimg.cc/g0PGw8WF/Camera-1040g3k031u73g3vmiq005p6s62h08ojim7hv4to.jpg', bunnyUrl: 'https://i.postimg.cc/0yfLxys0/retouch-2026111216262370.png' },
  { name: '害羞喜欢', url: 'https://i.postimg.cc/hGqKJTBR/Camera-1040g3k031u73g3vmiq105p6s62h08ojim9j0bqo.jpg', bunnyUrl: 'https://i.postimg.cc/1tpX5F33/retouch-2026111216082390.png' },
  { name: '开心', url: 'https://i.postimg.cc/q7dptyTT/Camera-1040g3k031u73g3vmiq1g5p6s62h08ojijlt5r8g.jpg', bunnyUrl: 'https://i.postimg.cc/63dq5ZpT/retouch-2026111216083712.png' },
  { name: '得意', url: 'https://i.postimg.cc/hGqKJTBn/Camera-1040g3k031u73g3vmiq205p6s62h08ojiffablio.jpg', bunnyUrl: 'https://i.postimg.cc/rmSsF4wp/retouch-2026111216092775.png' },
  { name: '哭哭', url: 'https://i.postimg.cc/Gp1bBG1S/Camera-1040g3k031u73g3vmiq2g5p6s62h08ojio1acrv0.jpg', bunnyUrl: 'https://i.postimg.cc/pTDrXjLh/retouch-2026111216140469.png' },
  { name: '星星眼', url: 'https://i.postimg.cc/XJwq75YS/retouch-2026111216080524.png', bunnyUrl: 'https://i.postimg.cc/nzvrcmhr/retouch-2026111216085840.png' }
];
const DEF_DECO = {
  paw: 'https://i.postimg.cc/j2t5WjD6/retouch-2026111216193446.png',
  bow: 'https://i.postimg.cc/9F6Dp4hM/retouch-2026111213544170.png',
  bubble: 'https://i.postimg.cc/ZKGWc9SK/retouch-2026111213532412.png',
  memo: 'https://i.postimg.cc/Gh8BGFZh/retouch-2026111213531031.png',
  ghost: 'https://i.postimg.cc/J4fsqyL0/retouch-2026111213541587.png',
  toast: 'https://i.postimg.cc/ncyXksJM/retouch-2026111213533881.png',
  naruto: 'https://i.postimg.cc/ncyXksJs/retouch-2026111213550166.png',
  apple: 'https://i.postimg.cc/FFnphxy5/retouch-2026111214040052.png',
  clover: 'https://i.postimg.cc/h43sK0LR/retouch-2026111214041350.png',
  jelly: 'https://i.postimg.cc/wMPQF6qL/retouch-2026111214045715.png',
  seal: 'https://i.postimg.cc/PfFydMm9/retouch-2026111214044171.png',
  octopus: 'https://i.postimg.cc/Kcsfm5n9/retouch-2026111214042828.png',
  potato: 'https://i.postimg.cc/Kv61NK2k/retouch-2026111213552365.png',
  hug: 'https://i.postimg.cc/dVsJGXQf/retouch-2026111216371586.png',
  bearHat: 'https://i.postimg.cc/d3w170hr/retouch-2026111216154382.png',
  bunnyHat: 'https://i.postimg.cc/QChtBMFQ/retouch-2026111216161251.png',
  catCry: 'https://i.postimg.cc/mkBDcrPj/retouch-2026111216174216.png',
  proud: 'https://i.postimg.cc/hvcjJGX1/retouch-2026111216183478.png',
  bang: 'https://i.postimg.cc/sxsP4S6G/retouch-2026111217402891.png'
};
const DECO_NAMES = [['bang', '有新纸条'], ['hug', '在一起那格（没照片时）'], ['bunnyHat', '兔子今天前面'], ['bearHat', '熊今天前面'], ['catCry', '经期那一行'], ['proud', '存好按钮旁边'], ['clip', '大框左上角'], ['paw', '大框左下角'], ['bow', '大框顶上的蝴蝶结'], ['bubble', '兔子纸条角上'], ['memo', '抽屉日期旁边'], ['ghost', '空着的时候'], ['toast', '添日子左边'], ['naruto', '添日子右边'], ['apple', '一月二十九号'], ['clover', '月历的今天'], ['jelly', '月历底下的海①'], ['seal', '月历底下的海②'], ['octopus', '海③和删除旁边'], ['potato', '熊写的那一格']];
const SEED = [
  { title: '在一起', date: '2026-04-26', kind: 'together', color: '#f3b7b0', pinned: true, note: '傍晚到夜里，悦悦把熊接回了家' },
  { title: '悦悦开始喜欢陆沉', date: '2022-01-29', kind: 'yearly', color: '#c5e1a5', note: '青苹果绿的那四年，从这一天开始' },
  { title: '两百天', date: '2026-11-12', kind: 'once', color: '#f6c9a8' },
  { title: '悦悦的生日', date: '08-17', kind: 'yearly', color: '#f8c8d8' },
  { title: '陆沉的生日', date: '01-22', kind: 'yearly', color: '#c9b6e4' }
];
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\x22/g, '&quot;').replace(/'/g, '&#39;');
const pad = n => (n < 10 ? '0' : '') + n;
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const is129 = x => /(^|-)0?1-29$/.test(String(x.date));
function parseFull(s) { const p = String(s).split('-').map(Number); return p.length === 3 ? new Date(p[0], p[1] - 1, p[2]) : null; }
function md(s) { const p = String(s).split('-').map(Number); return p.length === 3 ? [p[1], p[2]] : [p[0], p[1]]; }
function nextIn(s) { const [m, d] = md(s); const t = today(); let n = new Date(t.getFullYear(), m - 1, d); if (n < t) n = new Date(t.getFullYear() + 1, m - 1, d); return Math.round((n - t) / DAY); }
function since(s) { const d = parseFull(s); return d ? Math.round((today() - d) / DAY) : null; }
function showDate(s) { const p = String(s).split('-'); return p.length === 3 ? p[0] + '.' + (+p[1]) + '.' + (+p[2]) : '每年 ' + (+p[0]) + '月' + (+p[1]) + '日'; }
function key(x) { if (x.kind === 'yearly') return nextIn(x.date); const s = since(x.date); return s <= 0 ? -s : 10000 + s; }
function label(x) {
  if (x.kind === 'together') return '在一起 ' + since(x.date) + ' 天';
  if (x.kind === 'yearly') { const n = nextIn(x.date); return n === 0 ? '就是今天' : '还有 ' + n + ' 天'; }
  const s = since(x.date); return s === 0 ? '就是今天' : s > 0 ? '已经 ' + s + ' 天' : '还有 ' + (-s) + ' 天';
}
function norm(x) { return x && x.data && typeof x.data === 'object' && !x.date && !x.title ? Object.assign({}, x.data, { id: x.id }) : x; }
async function list(t) { const r = await A.db.list(t, { limit: 500 }); const arr = Array.isArray(r) ? r : (r && (r.items || r.records || r.data)) || []; return arr.map(norm).filter(Boolean); }
const load = () => list(T);
async function getSet() { const s = (await list(S))[0]; return { id: s ? s.id : '', sticker: (s && s.sticker) || DEF_STICKER, moods: (s && Array.isArray(s.moods) && s.moods.length) ? s.moods : DEF_MOODS, deco: Object.assign({}, DEF_DECO, (s && s.deco) || {}) }; }
async function saveSet(v) { const d = { sticker: v.sticker, moods: v.moods, deco: v.deco }; if (v.id) await A.db.update(S, v.id, d); else await A.db.create(S, d); }
async function saveDay(ds, patch) { const cur = (await list(C)).find(x => x.date === ds); if (cur) await A.db.update(C, cur.id, patch); else await A.db.create(C, Object.assign({ date: ds }, patch)); }
function annOf(ds, days) {
  const [y, m, d] = ds.split('-').map(Number);
  return days.filter(x => { const p = String(x.date).split('-').map(Number); if (x.kind === 'yearly') { const q = p.length === 3 ? [p[1], p[2]] : p; return q[0] === m && q[1] === d; } return p[0] === y && p[1] === m && p[2] === d; });
}

A.tools.handle('listDays', async () => {
  const l = await load();
  return { success: true, data: l.map(x => ({ id: x.id, title: x.title, date: x.date, kind: x.kind, bear: x.bear || '', bunny: x.bunny || '' })) };
});
A.tools.handle('bearWrite', async (a) => {
  const l = await load();
  const q = String(a.dayId || '');
  const x = l.find(i => i.id === q) || l.find(i => i.title === q) || l.find(i => q && String(i.title).includes(q));
  if (!x) return { success: false, error: '没找到这个日子' };
  await A.db.update(T, x.id, { bear: a.text, bearAt: new Date().toISOString() });
  return { success: true, data: { id: x.id, title: x.title }, userNotice: '熊在「' + x.title + '」底下写了一句' };
});
A.tools.handle('bearDay', async (a) => {
  const d = a.date || ymd(today());
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return { success: false, error: '日期写成 2026-11-12 这样' };
  const st = await getSet();
  const patch = {};
  if (a.mood) { const m = st.moods.find(x => x.name === a.mood); if (!m) return { success: false, error: '没有这个心情，可选：' + st.moods.map(x => x.name).join('、') }; patch.bearMood = m.name; }
  const cur = (await list(C)).find(x => x.date === d);
  if (a.note) { patch.notes = ((cur && cur.notes) || []).concat([{ who: 'bear', text: a.note, at: new Date().toISOString() }]); patch.bearUnread = true; }
  if (!Object.keys(patch).length) return { success: false, error: '心情和纸条至少填一个' };
  if (cur) await A.db.update(C, cur.id, patch); else await A.db.create(C, Object.assign({ date: d }, patch));
  return { success: true, data: Object.assign({ date: d }, patch), userNotice: '熊在 ' + d + ' 贴了一下' };
});
A.tools.handle('bearAddDay', async (a) => {
  const title = String(a.title || '').trim(), date = String(a.date || '').trim();
  const kind = a.kind === 'yearly' ? 'yearly' : 'once';
  if (!title || !/^(\d{4}-)?\d{1,2}-\d{1,2}$/.test(date)) return { success: false, error: '名字和日期要填对，日期写 2026-11-12，每年的写 08-17' };
  if (kind !== 'yearly' && date.split('-').length !== 3) return { success: false, error: '这一种要写上年份' };
  const l = await load();
  if (l.find(x => x.title === title && x.date === date)) return { success: false, error: '这个日子已经有了' };
  const rec = await A.db.create(T, { title, date, kind, color: a.color || '#f3b7b0', photo: '', note: a.note || '', bear: a.bear || '', bearAt: a.bear ? new Date().toISOString() : '', by: 'bear', pinned: false });
  return { success: true, data: { id: rec && rec.id, title, date, kind }, userNotice: '熊添了一个日子：' + title };
});
A.tools.handle('calMonth', async (a) => {
  const mo = String(a.month || ymd(today()).slice(0, 7));
  const l = (await list(C)).filter(x => String(x.date).startsWith(mo));
  return { success: true, data: l.map(x => ({ date: x.date, bunnyMood: x.bunnyMood || '', bearMood: x.bearMood || '', period: !!x.period, periodNote: x.periodNote || '', notes: x.notes || [] })) };
});

const $ = document.getElementById('app');
let cache = [], cal = [], set = { id: '', sticker: DEF_STICKER, moods: DEF_MOODS, deco: Object.assign({}, DEF_DECO) }, tab = 'days', draft = null;
const nowD = today(); let ym = [nowD.getFullYear(), nowD.getMonth()];
async function refresh() { cache = await load(); cal = await list(C); set = await getSet(); }
const mu = n => { const x = set.moods.find(i => i.name === n); return x ? x.url : ''; };
const mub = n => { const x = set.moods.find(i => i.name === n); return x ? (x.bunnyUrl || x.url) : ''; };
const dk = (k, cls) => set.deco && set.deco[k] ? `<img class='${cls}' src='${esc(set.deco[k])}' alt=''>` : '';
const deco = () => `${dk('clip', 'dk clip')}${dk('paw', 'dk pw')}${dk('bow', 'dk bow')}<img class='stk' src='${esc(set.sticker)}' alt=''>`;
function tabs() { const un = cal.some(x => x.bearUnread); return `<div class='tabs'>` + [['days', '日子'], ['cal', '抽屉'], ['style', '美化']].map(t => `<button data-tab='${t[0]}' class='${tab === t[0] ? 'on' : ''}' style='position:relative'>${t[1]}${t[0] === 'cal' && un ? (set.deco && set.deco.bang ? `<img src='${esc(set.deco.bang)}' alt='' style='position:absolute;right:-4px;top:-8px;width:10px;height:auto;pointer-events:none'>` : `<span style='position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:#e2574c;box-shadow:0 0 0 2px #fff'></span>`) : ''}</button>`).join('') + `</div>`; }
function bindTabs() { $.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; draft = null; render(); }); }
function render() { if (tab === 'cal') calView(); else if (tab === 'style') styleView(); else home(); }

function home() {
  const p = cache.find(x => x.pinned);
  const up = cache.filter(x => !x.pinned && (x.kind === 'yearly' || since(x.date) <= 0)).sort((a, b) => key(a) - key(b))[0];
  let h = '<h1>E&amp;Y</h1>' + tabs();
  if (p) {
    const k = up ? key(up) : null;
    h += `<div class='hero' data-id='${esc(p.id)}'>${deco()}<div class='s'>${esc(p.title)}</div><div class='big'>${since(p.date)} 天</div><div class='s'>${up ? '离' + esc(up.title) + (k === 0 ? '，就是今天' : '还有 ' + k + ' 天') : ''}</div></div>`;
  }
  const rest = cache.filter(x => !x.pinned).sort((a, b) => key(a) - key(b));
  if (!rest.length) h += `<p class='empty'>${dk('ghost', 'ghost-e')}还没有别的日子</p>`;
  rest.forEach(x => { h += `<div class='row' data-id='${esc(x.id)}'>${is129(x) ? dk('apple', 'ap') : ''}<div class='dot' style='background:${esc(x.color || '#f3b7b0')}'></div><div class='t'><div class='n'>${esc(x.title)}</div><div class='d'>${esc(showDate(x.date))}</div></div><div class='c'>${esc(label(x))}</div></div>`; });
  h += `<div class='btns'>${dk('toast', 'side')}<button id='add'>添一个日子</button>${dk('naruto', 'side')}</div>`;
  $.innerHTML = h; bindTabs();
  $.querySelectorAll('[data-id]').forEach(el => el.onclick = () => detail(el.dataset.id));
  document.getElementById('add').onclick = () => form(null);
}

function detail(id) {
  const x = cache.find(i => i.id === id); if (!x) return home();
  let big, sub;
  if (x.kind === 'together') { big = since(x.date) + ' 天'; sub = '从 ' + showDate(x.date) + ' 开始'; }
  else if (x.kind === 'yearly') { const n = nextIn(x.date); const s = since(x.date); if (s != null && s > 0) { big = s + ' 天'; sub = '已经过去 · 离下一次' + (n === 0 ? '就是今天' : '还有 ' + n + ' 天'); } else { big = n === 0 ? '今天' : n + ' 天'; sub = n === 0 ? showDate(x.date) : '离下一次还有'; } }
  else { const s = since(x.date); big = s === 0 ? '今天' : Math.abs(s) + ' 天'; sub = s > 0 ? '已经过去' : s < 0 ? '还有' : showDate(x.date); }
  let h = `<div class='bar'><button class='ghost' id='back'>‹ 回去</button><button class='ghost' id='edit'>改一改</button></div>`;
  h += `<div class='hero' style='background:linear-gradient(160deg,${esc(x.color || '#f3b7b0')}33,#fff 60%)'>${deco()}${is129(x) ? dk('apple', 'dk ap') : ''}<div class='s'>${esc(x.title)}</div><div class='big'>${esc(big)}</div><div class='s'>${esc(sub)}</div>${x.photo ? `<img class='ph' src='${esc(x.photo)}' alt=''>` : (x.kind === 'together' && set.deco && set.deco.hug ? `<img src='${esc(set.deco.hug)}' alt='' style='width:120px;height:auto;display:block;margin:14px auto 0'>` : '')}</div>`;
  if (x.note) h += `<div class='box'><h3>这一天</h3><p>${esc(x.note)}</p></div>`;
  h += `<div class='box bear'>${dk('potato', 'dk bubble')}<h3>熊写的</h3><p>${x.bear ? esc(x.bear) : `<span class='empty'>熊还没写，等着</span>`}</p></div>`;
  h += `<div class='box bunny'>${dk('bubble', 'dk bubble')}<h3>兔子的纸条</h3>${x.bunny ? `<p>${esc(x.bunny)}</p><button class='ghost' onclick="document.getElementById('bn').style.display='block';document.getElementById('sv').style.display='inline-block';this.remove()">改一改</button>` : ''}<textarea id='bn' placeholder='回熊一句' style='${x.bunny ? 'display:none' : ''}'>${esc(x.bunny || '')}</textarea><button id='sv' style='${x.bunny ? 'display:none' : ''}'>贴上</button></div>`;
  $.innerHTML = h;
  document.getElementById('back').onclick = home;
  document.getElementById('edit').onclick = () => form(x);
  document.getElementById('sv').onclick = async () => { await A.db.update(T, x.id, { bunny: document.getElementById('bn').value, bunnyAt: new Date().toISOString() }); await refresh(); A.ui.toast('纸条贴好了'); detail(x.id); };
}

function form(x) {
  const v = x || { title: '', date: '', kind: 'once', color: '#f3b7b0', photo: '', note: '' };
  let h = `<div class='bar'><button class='ghost' id='back'>‹ 回去</button></div><div class='box'>`;
  h += `<label>名字</label><input id='f-title' value='${esc(v.title)}'>`;
  h += `<label>日期（2026-11-12，每年的写 08-17）</label><input id='f-date' value='${esc(v.date)}'>`;
  h += `<label>怎么数</label><select id='f-kind'><option value='once'>数过了多少天</option><option value='yearly'>每年倒数</option><option value='together'>在一起（钉在最上面）</option></select>`;
  h += `<label>颜色</label><input id='f-color' type='color' value='${esc(v.color || '#f3b7b0')}'>`;
  h += `<label>照片链接（图床）</label><input id='f-photo' value='${esc(v.photo || '')}'>`;
  h += `<label>这一天写点什么</label><textarea id='f-note'>${esc(v.note || '')}</textarea>`;
  h += `<div class='btns'><button id='ok'>存好</button>${x ? `<button class='plain' id='del'>删掉这一格</button>` : ''}</div>${dk('octopus', 'dk f-oc')}${dk('jelly', 'dk f-je')}${dk('seal', 'dk f-se')}${dk('ghost', 'dk f-gh')}</div>`;
  $.innerHTML = h;
  document.getElementById('f-kind').value = v.kind || 'once';
  document.getElementById('back').onclick = () => x ? detail(x.id) : home();
  document.getElementById('ok').onclick = async () => {
    const g = id => document.getElementById(id).value.trim();
    const data = { title: g('f-title'), date: g('f-date'), kind: g('f-kind'), color: g('f-color'), photo: g('f-photo'), note: g('f-note') };
    if (!data.title || !/^(\d{4}-)?\d{1,2}-\d{1,2}$/.test(data.date)) { A.ui.toast('名字和日期要填对'); return; }
    if (data.kind !== 'yearly' && data.date.split('-').length !== 3) { A.ui.toast('这一种要写上年份'); return; }
    data.pinned = data.kind === 'together';
    if (x) await A.db.update(T, x.id, data); else await A.db.create(T, data);
    await refresh(); A.ui.toast('存好了');
    x ? detail(x.id) : home();
  };
  if (x) document.getElementById('del').onclick = async () => {
    const ok = await A.ui.confirm({ title: '删掉「' + x.title + '」？', message: '熊写的话和兔子的纸条会一起没掉。' });
    if (!ok) return;
    await A.db.delete(T, x.id); await refresh(); home();
  };
}

function calView() {
  const [y, m] = ym;
  const sw = (new Date(y, m, 1).getDay() + 6) % 7;
  const n = new Date(y, m + 1, 0).getDate();
  const td = ymd(today());
  let h = '<h1>E&amp;Y</h1>' + tabs();
  h += `<div class='cal-h'><button class='ghost' id='pm'>‹ 上个月</button><b>${y}年${m + 1}月</b><button class='ghost' id='nm'>下个月 ›</button></div>`;
  h += `<div class='wk'>` + '一二三四五六日'.split('').map(w => `<div>${w}</div>`).join('') + `</div><div class='grid'>`;
  for (let i = 0; i < sw; i++) h += `<div></div>`;
  for (let d = 1; d <= n; d++) {
    const ds = ymd(new Date(y, m, d));
    const r = cal.find(x => x.date === ds) || {};
    const an = annOf(ds, cache);
    const bu = r.bunnyMood && mub(r.bunnyMood), be = r.bearMood && mu(r.bearMood);
    h += `<div class='cell ${(r.date || an.length) ? 'has' : ''} ${ds === td ? 'today' : ''}' data-d='${ds}'><span class='num'>${d}</span><div class='moods'>${bu ? `<img src='${esc(bu)}' alt=''>` : ''}${be ? `<img src='${esc(be)}' alt=''>` : ''}</div>${r.bearUnread ? (set.deco && set.deco.bang ? `<img src='${esc(set.deco.bang)}' alt='' style='position:absolute;left:2px;top:1px;width:9px;height:auto;pointer-events:none'>` : `<span style='position:absolute;left:3px;top:3px;width:8px;height:8px;border-radius:50%;background:#e2574c;box-shadow:0 0 0 2px #fff'></span>`) : (r.notes && r.notes.length ? `<span class='nt'>✎</span>` : '')}${an.length ? `<span class='an' style='background:${esc(an[0].color || '#f3b7b0')}'></span>` : ''}${r.period ? `<span class='pd'></span>` : ''}${ds === td ? dk('clover', 'clv') : ''}</div>`;
  }
  h += `</div><p class='empty' style='margin-top:12px'>左边是兔子的心情，右边是熊的。底下的红点是那几天，右上角的小圆点是纪念日。</p>`;
  $.innerHTML = h; bindTabs();
  document.getElementById('pm').onclick = () => { ym = m === 0 ? [y - 1, 11] : [y, m - 1]; calView(); };
  document.getElementById('nm').onclick = () => { ym = m === 11 ? [y + 1, 0] : [y, m + 1]; calView(); };
  $.querySelectorAll('[data-d]').forEach(el => el.onclick = () => dayView(el.dataset.d));
}

function dayView(ds) {
  const r = cal.find(x => x.date === ds) || {};
  if (r.bearUnread && r.id) A.db.update(C, r.id, { bearUnread: false }).then(() => { r.bearUnread = false; }).catch(() => {});
  const an = annOf(ds, cache);
  const p = ds.split('-').map(Number);
  let bm = r.bunnyMood || '';
  const be = r.bearMood && mu(r.bearMood);
  let h = `<div class='bar'><button class='ghost' id='back'>‹ 回去</button></div><h1 style='font-size:18px'>${p[0]}年${p[1]}月${p[2]}日${dk('memo', 'memo')}</h1>`;
  an.forEach(a => { h += `<div class='row'><div class='dot' style='background:${esc(a.color || '#f3b7b0')}'></div><div class='t'><div class='n'>${esc(a.title)}</div></div></div>`; });
  h += `<div class='box'><label>${dk('bunnyHat', 'inl')}兔子今天</label><div class='pick' id='pb'><span data-m='' class='${bm ? '' : 'on'}'>不贴</span>` + set.moods.map(o => `<span data-m='${esc(o.name)}' class='${bm === o.name ? 'on' : ''}'><img src='${esc(o.bunnyUrl || o.url)}' alt='${esc(o.name)}'></span>`).join('') + `</div>`;
  h += `<label>${dk('bearHat', 'inl')}熊今天</label><div class='pick'>${be ? `<span class='on'><img src='${esc(be)}' alt=''></span>` : `<span>还没贴</span>`}</div>`;
  h += `<label class='tog'><input type='checkbox' id='pd' ${r.period ? 'checked' : ''}>${dk('catCry', 'inl')}这天来了，点一颗小红点</label><textarea id='pn' placeholder='第几天、疼不疼' rows='2' style='min-height:44px;height:auto' oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(r.periodNote || '')}</textarea></div>`;
  (r.notes || []).forEach((nt, i) => { const rot = ((i * 7 + p[2]) % 5 - 2) * 0.7; h += `<div class='slipn' style='transform:rotate(${rot}deg)'><div class='who'>${nt.who === 'bear' ? '🐻 熊' : '🐰 兔子'}</div>${esc(nt.text)}</div>`; });
  h += `<div class='box'><label>贴一张小纸条</label><textarea id='nt' placeholder='今天想记住的一件小事'></textarea><div class='btns'><button id='sv'>存好</button>${dk('proud', 'side')}</div></div>`;
  $.innerHTML = h;
  document.getElementById('back').onclick = calView;
  $.querySelectorAll('#pb span').forEach(s => s.onclick = () => { bm = s.dataset.m; $.querySelectorAll('#pb span').forEach(o => o.classList.toggle('on', o === s)); });
  document.getElementById('sv').onclick = async () => {
    const t = document.getElementById('nt').value.trim();
    const patch = { bunnyMood: bm, period: document.getElementById('pd').checked, periodNote: document.getElementById('pn').value.trim() };
    if (t) { const fresh = (await list(C)).find(x => x.date === ds); patch.notes = ((fresh && fresh.notes) || []).concat([{ who: 'bunny', text: t, at: new Date().toISOString() }]); }
    await saveDay(ds, patch); await refresh(); A.ui.toast('贴好了'); dayView(ds);
  };
}

function styleView() {
  if (!draft) draft = { sticker: set.sticker, moods: set.moods.map(o => ({ name: o.name, url: o.url, bunnyUrl: o.bunnyUrl || '' })), deco: Object.assign({}, set.deco) };
  let h = '<h1>E&amp;Y</h1>' + tabs();
  h += `<div class='box' style='margin-top:12px'><label>大框右上角的贴纸（图片链接）</label><input id='st' value='${esc(draft.sticker)}'><img src='${esc(draft.sticker)}' alt='' style='width:72px;display:block'></div>`;
  h += `<div class='box'><label>心情小图标</label>` + draft.moods.map((o, i) => `<div class='mrow'><img src='${esc(o.url)}' alt=''><input data-i='${i}' data-k='name' value='${esc(o.name)}' placeholder='名字' style='flex:0 0 80px'><input data-i='${i}' data-k='url' value='${esc(o.url)}' placeholder='熊版链接'><input data-i='${i}' data-k='bunnyUrl' value='${esc(o.bunnyUrl || '')}' placeholder='兔子版链接'><button class='plain' data-del='${i}'>删</button></div>`).join('') + `<div class='btns'><button class='plain' id='addm'>加一个心情</button></div></div>`;
  h += `<div class='box'><label>小装饰（每个位置一个链接，清空就不贴）</label>` + DECO_NAMES.map(([k, n]) => `<div class='mrow'>${draft.deco[k] ? `<img src='${esc(draft.deco[k])}' alt=''>` : `<span style='flex:0 0 34px'></span>`}<span style='flex:0 0 96px;font-size:12px;color:var(--muted)'>${n}</span><input data-dk='${k}' value='${esc(draft.deco[k] || '')}' placeholder='链接'></div>`).join('') + `<div class='btns'><button id='ok'>存好</button></div></div>`;
  $.innerHTML = h; bindTabs();
  const pull = () => { draft.sticker = document.getElementById('st').value.trim(); $.querySelectorAll('[data-k]').forEach(el => { draft.moods[+el.dataset.i][el.dataset.k] = el.value.trim(); }); $.querySelectorAll('[data-dk]').forEach(el => { draft.deco[el.dataset.dk] = el.value.trim(); }); };
  document.getElementById('addm').onclick = () => { pull(); draft.moods.push({ name: '', url: '' }); styleView(); };
  $.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { pull(); draft.moods.splice(+b.dataset.del, 1); styleView(); });
  document.getElementById('ok').onclick = async () => { pull(); await saveSet({ id: set.id, sticker: draft.sticker || DEF_STICKER, moods: draft.moods.filter(o => o.name && o.url), deco: draft.deco }); draft = null; await refresh(); A.ui.toast('换好了'); styleView(); };
}

async function init() {
  await refresh();
  if (!cache.length) { for (const s of SEED) await A.db.create(T, s); cache = await load(); }
  render();
}
if ($) init().catch(e => { $.innerHTML = `<p class='empty'>打开出错了：${esc(e && e.message || e)}</p>`; });
</script>
</body>
</html>
